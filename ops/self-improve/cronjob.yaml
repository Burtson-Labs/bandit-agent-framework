# Weekly self-improve PR loop — Rung 3 of the self-improvement ladder.
# The nightly bench (ops/nightly-bench/) MEASURES; this job PROPOSES: it runs
# the eval fresh, mines the report with the deterministic v1 proposer, and
# opens a pull request against main. A PR is the only thing this job can
# produce — it has no path to main, and proposals are hard-allowlisted to
# new eval fixtures + .bandit/lessons.md (see README.md for the trust model).
#
# Schedule: Sunday 10:00 UTC — an hour after the Sunday nightly bench slot,
# and well clear of the ~02:00-02:30 CT Mongo maintenance window.
#
# Setup (one-time, out of git — never commit real values):
#   the bandit-eval-secrets secret needs, alongside BANDIT_API_KEY, a
#   GITHUB_TOKEN with repo scope (push branches + open PRs on
#   Burtson-Labs/bandit-agent-framework). Documented in README.md — the
#   token is added to the EXISTING secret, not created here.
#
# Logs: kubectl -n bandit logs job/<latest weekly-self-improve job>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-self-improve
  namespace: bandit
spec:
  schedule: "0 10 * * 0"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: self-improve
              # node:24 (not 22 like nightly-bench): propose.ts runs as plain
              # `node propose.ts` via default-on type stripping.
              image: node:24-bookworm
              envFrom:
                - secretRef:
                    name: bandit-eval-secrets
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -uo pipefail
                  corepack enable
                  # Debian bookworm's gh is old but plenty for `pr create`.
                  apt-get update -qq && apt-get install -y -qq --no-install-recommends gh
                  git clone --depth 1 https://github.com/Burtson-Labs/bandit-agent-framework.git /work
                  cd /work
                  pnpm install --frozen-lockfile && pnpm build
                  echo "── eval (fresh evidence for the proposer) ──"
                  # A failing eval is EVIDENCE here, not a job failure — the
                  # proposer turns failures into proposals, so don't abort.
                  pnpm --filter @burtson-labs/bandit-stealth-cli eval -- --provider bandit --model bandit-core-2 \
                    2>&1 | tee /tmp/eval.out || echo "eval reported failures (expected input for the proposer)"
                  echo "── propose ──"
                  # In-cluster, .bandit/turns/ doesn't exist (turn logs are
                  # local-machine evidence, gitignored) — the proposer notes 0
                  # scanned and works from the bench report alone. Local runs
                  # get both sources.
                  node ops/self-improve/propose.ts .bandit/eval-report.md --out /tmp/proposals.json
                  echo "── open PR ──"
                  export GH_TOKEN="${GITHUB_TOKEN:?bandit-eval-secrets is missing GITHUB_TOKEN — see ops/self-improve/README.md}"
                  bash ops/self-improve/open-pr.sh /tmp/proposals.json
              resources:
                requests: { cpu: "500m", memory: "2Gi" }
                limits: { memory: "4Gi" }
