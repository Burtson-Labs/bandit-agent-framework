# Build and pin the two repository images before applying. Model weights are
# intentionally provisioned separately; applying this manifest never downloads
# a model or claims the GPU (the worker starts at zero replicas).
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-image
  labels:
    app.kubernetes.io/part-of: bandit
---
# Static, node-bound model storage. Create /mnt/ai-models/comfyui on
# son-of-anton and populate it with verified models before starting the worker.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-image-models-son-of-anton
spec:
  capacity:
    storage: 250Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-local-models
  local:
    path: /mnt/ai-models/comfyui
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [son-of-anton]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-models
  namespace: ai-image
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ai-local-models
  volumeName: ai-image-models-son-of-anton
  resources:
    requests:
      storage: 250Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-api
  namespace: ai-image
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-worker
  namespace: ai-image
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-api
  namespace: ai-image
  labels:
    app.kubernetes.io/name: image-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: image-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-api
    spec:
      serviceAccountName: image-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      # The repository image is intentionally amd64-only, matching the GPU
      # worker. The API does not request a GPU and therefore cannot contend for
      # it, but it must run on the cluster's amd64 node.
      nodeSelector:
        kubernetes.io/hostname: son-of-anton
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-api
          image: ghcr.io/burtson-labs/image-api:5c726ea0a4a460c773802a1cc4ec87ba2b3c62cd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: COMFYUI_BASE_URL
              value: http://image-worker.ai-image.svc.cluster.local:8188
            - name: MINIO_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: MINIO_BUCKET
              value: generated-images
            - name: FLUX_MODEL_SHA256
              value: "ead426278b49030e9da5df862994f25ce94ab2ee4df38b556ddddb3db093bf72"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: image-api-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: image-api-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: image-api
  namespace: ai-image
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: image-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Anton is the only component that should scale this Deployment from 0 to 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-worker
  namespace: ai-image
  labels:
    app.kubernetes.io/name: image-worker
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: image-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-worker
    spec:
      serviceAccountName: image-worker
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      nodeSelector:
        kubernetes.io/hostname: son-of-anton
        node-role.kubernetes.io/ai: ""
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: verify-models
          image: ghcr.io/burtson-labs/image-worker:5c726ea0a4a460c773802a1cc4ec87ba2b3c62cd
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              test -s /opt/ComfyUI/models/checkpoints/flux1-schnell-fp8.safetensors
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: models
              mountPath: /opt/ComfyUI/models
              readOnly: true
      containers:
        - name: comfyui
          # Build with a CUDA 12.8 + Blackwell-capable PyTorch stack while the
          # node remains on R570. Pin ComfyUI and custom-node commits in-image.
          image: ghcr.io/burtson-labs/image-worker:5c726ea0a4a460c773802a1cc4ec87ba2b3c62cd
          imagePullPolicy: IfNotPresent
          args:
            - --listen
            - 0.0.0.0
            - --port
            - "8188"
            - --disable-auto-launch
          ports:
            - name: http
              containerPort: 8188
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet: {path: /system_stats, port: http}
            failureThreshold: 180
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /system_stats, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /system_stats, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: models
              mountPath: /opt/ComfyUI/models
              readOnly: true
            - name: work
              mountPath: /opt/ComfyUI/input
              subPath: input
            - name: work
              mountPath: /opt/ComfyUI/output
              subPath: output
            - name: work
              mountPath: /opt/ComfyUI/temp
              subPath: temp
            - name: cache
              mountPath: /home/comfy/.cache
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: image-models
        - name: work
          emptyDir:
            sizeLimit: 100Gi
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: image-worker
  namespace: ai-image
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: image-worker
  ports:
    - name: http
      port: 8188
      targetPort: http
---
# Confirm CNI NetworkPolicy enforcement before relying on these rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-api-ingress
  namespace: ai-image
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: image-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: anton
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-worker-ingress
  namespace: ai-image
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: image-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: image-api
      ports:
        - protocol: TCP
          port: 8188
