name: Image generation images

on:
  push:
    branches: [main]
    paths:
      - services/image-api/**
      - services/image-worker/**
      - .github/workflows/image-generation-images.yaml
  pull_request:
    branches: [main]
    paths:
      - services/image-api/**
      - services/image-worker/**
      - .github/workflows/image-generation-images.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: image-api
            context: services/image-api
          - name: image-worker
            context: services/image-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for CUDA worker
        if: matrix.name == 'image-worker'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/burtson-labs/${{ matrix.name }}:latest
            ghcr.io/burtson-labs/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
