# Builds and publishes the agent-runner service image (ADR-001).
#
# Path-filtered so ordinary framework work doesn't pay for a Docker build —
# only changes to the runner, its two workspace dependencies, or the
# lockfile/Dockerfile produce a new image. Tags: :latest tracks main,
# :sha-<commit> pins for rollback.
name: Agent Runner — Image

on:
  push:
    branches: [main]
    paths:
      - "services/agent-runner/**"
      - "packages/agent-core/**"
      - "packages/stealth-core-runtime/**"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/agent-runner-image.yaml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is not optional: the ENTIRE gateway cluster is a Pi fleet.
      # An amd64-only image passes CI, publishes, and CrashLoops the moment
      # agentRunner.enabled flips — caught on the first pull test.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agent-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/burtson-labs/agent-runner:latest
            ghcr.io/burtson-labs/agent-runner:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
