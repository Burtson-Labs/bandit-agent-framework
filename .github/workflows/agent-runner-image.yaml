# Builds and publishes the agent-runner service image (ADR-001).
#
# Path-filtered so ordinary framework work doesn't pay for a Docker build —
# only changes to the runner, its two workspace dependencies, or the
# lockfile/Dockerfile produce a new image. Tags: :latest tracks main,
# :sha-<commit> pins for rollback.
name: Agent Runner — Image

on:
  push:
    branches: [main]
    paths:
      - "services/agent-runner/**"
      - "packages/agent-core/**"
      - "packages/host-kit/**"
      - "packages/stealth-core-runtime/**"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/agent-runner-image.yaml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # arm64 is not optional: the ENTIRE gateway cluster is a Pi fleet.
      # An amd64-only image passes CI, publishes, and CrashLoops the moment
      # agentRunner.enabled flips — caught on the first pull test.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: services/agent-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/burtson-labs/agent-runner:latest
            ghcr.io/burtson-labs/agent-runner:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
