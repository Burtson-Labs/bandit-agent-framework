name: Training Studio images

on:
  push:
    branches: [main]
    paths:
      - services/training-api/**
      - services/training-worker/**
      - .github/workflows/training-images.yaml
  pull_request:
    branches: [main]
    paths:
      - services/training-api/**
      - services/training-worker/**
      - .github/workflows/training-images.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The API holds no GPU and runs anywhere in the cluster, Pis included.
          - name: training-api
            context: services/training-api
            platforms: linux/amd64,linux/arm64
          - name: training-worker
            context: services/training-worker
            platforms: linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (training-api)
        if: matrix.name == 'training-api'
        working-directory: services/training-api
        run: |
          python -m pip install -r requirements.txt mongomock==4.3.0
          python -m unittest tests.test_api
      - name: Unit tests (training-worker, CPU only)
        if: matrix.name == 'training-worker'
        working-directory: services/training-worker
        run: |
          python -m pip install httpx==0.28.1 boto3==1.40.39
          python -m unittest tests.test_worker
      - name: Free disk for CUDA worker
        if: matrix.name == 'training-worker'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
      - uses: docker/setup-qemu-action@v3
        if: matrix.name == 'training-api'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/burtson-labs/${{ matrix.name }}:latest
            ghcr.io/burtson-labs/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
