# Image for the Bandit ops CronJobs on the home cluster (nightly-banditbench,
# social-drafts, weekly-self-improve; manifests in Burtson-Labs/MinIo-k8s
# manifests/bandit-ops/). Built from release tags only, so a job always runs a
# tagged commit with the frozen lockfile; the manifests pin the digest.
#
# The job scripts (ops/cron-image/) come from the commit this workflow runs on,
# the packaged code from the tag. Image tag: :<git tag>-<recipe short sha>, plus
# OCI labels for both commits. The digest to pin is in the job summary.
# Package an existing tag with "Run workflow" and the tag name as ref.
name: Ops CronJob image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build (e.g. v1.7.458)
        required: true

permissions:
  contents: read

concurrency:
  group: ops-cron-image-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/burtson-labs/bandit-ops-cron

jobs:
  build-push:
    # The cluster's job nodes are arm64 Pis; build natively on an arm runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve the tag
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$GITHUB_REF_NAME}"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $ref"; exit 1; }
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
      - name: Recipe (job scripts) from this workflow's commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: recipe
          sparse-checkout: ops/cron-image
          persist-credentials: false
      - name: Code at the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          # .git goes into the image (social-drafts reads history, self-improve
          # pushes a branch), so the job token must not be left in .git/config.
          persist-credentials: false
      - name: Commit, and no credentials in .git/config
        id: commit
        run: |
          set -euo pipefail
          if grep -qiE 'extraheader|authorization|x-access-token' src/.git/config; then echo '::error::credentials in .git/config'; exit 1; fi
          {
            echo "sha=$(git -C src rev-parse HEAD)"
            echo "recipe=$(git -C recipe rev-parse HEAD)"
            echo "recipe_short=$(git -C recipe rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src
          file: recipe/ops/cron-image/Dockerfile
          build-contexts: recipe=recipe/ops/cron-image
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.ref.outputs.tag }}-${{ steps.commit.outputs.recipe_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/Burtson-Labs/bandit-agent-framework
            org.opencontainers.image.version=${{ steps.ref.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            ai.burtson.ops-cron.recipe-revision=${{ steps.commit.outputs.recipe }}
      - name: Summary
        run: |
          {
            echo "### ${IMAGE}:${{ steps.ref.outputs.tag }}-${{ steps.commit.outputs.recipe_short }}"
            echo
            echo "Pin in the CronJobs: \`${IMAGE}:${{ steps.ref.outputs.tag }}-${{ steps.commit.outputs.recipe_short }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
